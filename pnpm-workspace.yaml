# Three days of quarantine: a freshly published version is not installed until
# it has been on the registry long enough for a compromised release to be
# noticed and pulled. Do not lower this.
minimumReleaseAge: 4320
minimumReleaseAgeIgnoreMissingTime: false
resolutionMode: highest

# pnpm needs an explicit decision per package with a postinstall script; a
# blocked postinstall is the safe default.
allowBuilds:
  # Its install script is scripts/build-from-source.js, a fallback that only
  # compiles when no prebuilt binary exists for the platform; the binaries
  # ship through optionalDependencies. Same for jest 30's resolver binding.
  '@parcel/watcher': false
  unrs-resolver: false

overrides:
  # jest's coverage loader reads .nycrc.yaml with js-yaml 3, whose argparse 1
  # pulls sprintf-js (GHSA-hp3w-g68c-fv3c, no patched release). It only calls
  # load(), which js-yaml 4 keeps with the same signature.
  '@istanbuljs/load-nyc-config>js-yaml': 4.3.2
